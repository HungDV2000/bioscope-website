services:
  db:
    image: postgres:16-alpine
    container_name: dvcms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dvcms}
      POSTGRES_DB: dvcms
    ports:
      # Host port dải 26xxx để chạy song song với BioBot (đang chiếm 5432/6379/...)
      - "127.0.0.1:${DVCMS_DB_HOST_PORT:-26432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready trả exit 0 khi DB sẵn sàng accept connections. start_period
      # cho Postgres init lần đầu (initdb + recovery + bgwriter) — không tính
      # vào retries. Nếu disk đầy, initdb sẽ retry vô hạn vì Docker restart
      # loop — xem docs/06-deploy.md §"Troubleshooting DB: No space left".
      test: ["CMD-SHELL", "pg_isready -U dvcms -d dvcms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  cms:
    build:
      context: .
      dockerfile: apps/core-cms/Dockerfile
      args:
        # Baked into the webpack bundle at build time (assetPrefix). Must match the
        # runtime CMS_ASSET_PREFIX or the admin's dynamic chunks 404. Empty = off.
        CMS_ASSET_PREFIX: ${CMS_ASSET_PREFIX:-}
    # Tag the built image so the preview-proxy service can reuse it (no rebuild).
    image: dv-cms-cms
    container_name: dvcms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://dvcms:${POSTGRES_PASSWORD:-dvcms}@db:5432/dvcms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-please-change-this-to-a-long-random-secret}
      # Khoá tin cậy server-to-server với frontend (bỏ trống = lùi về PAYLOAD_SECRET).
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Google OAuth — ưu tiên cấu hình trong admin (Cài đặt Đăng nhập); env chỉ là fallback.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Public URLs (used by Payload cookies + revalidate hook). Match aaPanel proxy hostnames.
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-https://admin.bioscope.vn}
      FRONTEND_URL: ${FRONTEND_URL:-https://web.bioscope.vn}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      B2B_COOKIE: ${B2B_COOKIE:-bio-token}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/apps/core-cms/credentials/service-account.json}
      # ── AI ──
      # Nhà cung cấp cho sinh nội dung / đọc ảnh: openrouter | openai.
      # Đổi được ngay trong Admin → Hệ thống → Cài đặt AI; các biến này chỉ là
      # giá trị dự phòng khi ô trong admin bỏ trống.
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_APP: ${OPENROUTER_APP:-Bioscope CMS}
      OPENROUTER_SITE: ${OPENROUTER_SITE:-}
      # ⚠️ SINH ẢNH LUÔN QUA OPENAI — OpenRouter không có endpoint tạo ảnh.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Mistral OCR — chỉ dùng cho PDF scan. Bỏ trống = lùi về OCR bằng OpenAI.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-}
      # Model overrides (optional — sensible defaults baked in). See openaiService.ts.
      OPENAI_CONTENT_MODEL: ${OPENAI_CONTENT_MODEL:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-}
      NODE_ENV: production
      NODE_OPTIONS: --no-deprecation
      # Container internal port dải 26xxx (tránh xung đột 3000/3001)
      PORT: "26301"
      # ── Better Editor same-origin preview (opt-in) ──
      # Để trống = admin chạy bình thường. Khi bật preview-proxy + route admin qua
      # proxy, đặt CMS_ASSET_PREFIX=/cms-static (asset admin không đụng /_next của
      # frontend) và PREVIEW_ORIGIN=https://admin.bioscope.vn. Xem docs/better-editor-preview.md.
      CMS_ASSET_PREFIX: ${CMS_ASSET_PREFIX:-}
      PREVIEW_ORIGIN: ${PREVIEW_ORIGIN:-}
    ports:
      # Bind 127.0.0.1:26081 → container:26301 (chỉ aaPanel proxy mới truy cập được)
      - "127.0.0.1:${DVCMS_CMS_HOST_PORT:-26081}:26301"
    volumes:
      - media:/app/apps/core-cms/media

  frontend:
    build:
      context: .
      dockerfile: apps/bioscope-frontend/Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://admin.bioscope.vn}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://web.bioscope.vn}
    container_name: dvcms-frontend
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_started
    environment:
      NODE_ENV: production
      # Container internal port dải 26xxx
      PORT: "26300"
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-https://admin.bioscope.vn}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://web.bioscope.vn}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      # Server-side data fetches go over the internal Docker network (not the public
      # domain, which hair-pins and fails from inside the container).
      CMS_INTERNAL_URL: ${CMS_INTERNAL_URL:-http://cms:26301}
      # BẮT BUỘC: khoá ký cookie phiên thành viên. Thiếu = không ai đăng nhập được
      # (fail-closed, tránh chấp nhận cookie giả mạo).
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-please-change-this-to-a-long-random-secret}
      MEMBER_SESSION_SECRET: ${MEMBER_SESSION_SECRET:-}
      # Phải khớp với INTERNAL_API_SECRET của service cms.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Chỉ đặt khi Google báo redirect_uri_mismatch mà tên miền suy ra tự động
      # vẫn không khớp: điền ĐÚNG chuỗi đã khai ở Google Console, hệ thống dùng
      # nguyên văn. VD: https://bioscope.vn/api/auth/google/callback
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      # Bind 127.0.0.1:26080 → container:26300 (chỉ aaPanel proxy mới truy cập được)
      - "127.0.0.1:${DVCMS_FRONTEND_HOST_PORT:-26080}:26300"

  # Same-origin proxy for the Better Editor preview. Reuses the cms image (no
  # extra build). Opt-in: `docker compose --profile preview up -d preview-proxy`.
  # Then route admin.bioscope.vn → this proxy in nginx and set CMS_ASSET_PREFIX +
  # PREVIEW_ORIGIN on the cms service. See docs/better-editor-preview.md.
  preview-proxy:
    image: dv-cms-cms
    container_name: dvcms-preview-proxy
    restart: unless-stopped
    profiles: ["preview"]
    depends_on:
      cms:
        condition: service_started
      frontend:
        condition: service_started
    working_dir: /app/apps/core-cms
    command: ["node", "scripts/preview-proxy.mjs"]
    environment:
      PROXY_PORT: "26302"
      CMS_TARGET: http://cms:26301
      FRONTEND_TARGET: http://frontend:26300
    ports:
      - "127.0.0.1:${DVCMS_PREVIEW_HOST_PORT:-26082}:26302"

volumes:
  pgdata:
  media:
