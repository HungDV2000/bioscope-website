services:
  db:
    image: postgres:16-alpine
    container_name: dvcms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dvcms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dvcms}
      POSTGRES_DB: dvcms
    ports:
      - "127.0.0.1:${DVCMS_DB_HOST_PORT:-26432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvcms"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      dockerfile: apps/core-cms/Dockerfile
    container_name: dvcms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://dvcms:${POSTGRES_PASSWORD:-dvcms}@db:5432/dvcms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-please-change-this-to-a-long-random-secret}
      # Public URLs (used by Payload cookies + revalidate hook). Match nginx hostnames.
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://admin.bioscope.vn}
      FRONTEND_URL: ${FRONTEND_URL:-http://web.bioscope.vn}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      B2B_COOKIE: ${B2B_COOKIE:-bio-token}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/apps/core-cms/credentials/service-account.json}
      NODE_ENV: production
      NODE_OPTIONS: --no-deprecation
      PORT: "3001"
    expose:
      - "3001"
    volumes:
      - media:/app/apps/core-cms/media

  frontend:
    build:
      context: .
      dockerfile: apps/bioscope-frontend/Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://admin.bioscope.vn}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://web.bioscope.vn}
    container_name: dvcms-frontend
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://admin.bioscope.vn}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://web.bioscope.vn}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: dvcms-nginx
    restart: unless-stopped
    depends_on:
      - cms
      - frontend
    ports:
      - "127.0.0.1:${NGINX_HOST_PORT:-80}:80"
      - "${NGINX_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    # Health check (HTTPS endpoint)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "https://admin.bioscope.vn/admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  media: