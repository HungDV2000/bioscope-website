# nginx.conf — HTTPS reverse proxy cho bioscope production
# Container ports dải 26xxx (frontend:26300, cms:26301) để tránh xung đột
# với BioBot / các container khác trên host.
#
# Host ports (exposed by docker-compose):
#   - 26080  HTTP  → ACME challenge + redirect → 26443
#   - 26443  HTTPS → reverse proxy tới containers
#
# Domain routing:
#   - admin.bioscope.vn → cms:26301 (Payload Next.js admin)
#   - web.bioscope.vn   → frontend:26300 (Bioscope storefront)

events {
    worker_connections 1024;
}

http {
    # Larger payload cho Payload admin upload media
    client_max_body_size 50M;

    # Map Host header preservation
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ── Shared settings ────────────────────────────────────────
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # ── web.bioscope.vn → bioscope-frontend:26300 ────────────────
    server {
        listen 80;
        server_name web.bioscope.vn;

        # ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name web.bioscope.vn;

        ssl_certificate     /etc/letsencrypt/live/web.bioscope.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/web.bioscope.vn/privkey.pem;

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://frontend:26300;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Media (CMS media collection served via web for SEO)
        location /media/ {
            proxy_pass http://cms:26301;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend:26300;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # ── admin.bioscope.vn → core-cms:26301 ───────────────────────
    server {
        listen 80;
        server_name admin.bioscope.vn;

        # ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name admin.bioscope.vn;

        ssl_certificate     /etc/letsencrypt/live/admin.bioscope.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.bioscope.vn/privkey.pem;

        client_max_body_size 50M;

        # Static assets
        location /_next/static/ {
            proxy_pass http://cms:26301;
            proxy_set_header Host $host;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Payload media
        location /api/media/ {
            proxy_pass http://cms:26301;
            proxy_set_header Host $host;
        }
        location /media/ {
            proxy_pass http://cms:26301;
            proxy_set_header Host $host;
        }

        # Admin UI + API
        location / {
            proxy_pass http://cms:26301;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }
}